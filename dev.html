<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dev tools</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      body { margin: 0; background: #14122b; color: #fff; }
      main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 28px; margin: 0 0 16px; }
      h2 { font-size: 18px; margin: 24px 0 8px; color: #d6d2ee; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      a { display: flex; align-items: center; min-height: 48px; padding: 0 16px; border-radius: 12px; background: #1f1b3a; border: 1px solid #4a4278; color: #fff; text-decoration: none; font-size: 17px; }
      a:hover { background: #2f2a52; }
      a:focus-visible { outline: 3px solid #ffd54a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="/src/dev/tools.ts"></script>
  </body>
</html>
